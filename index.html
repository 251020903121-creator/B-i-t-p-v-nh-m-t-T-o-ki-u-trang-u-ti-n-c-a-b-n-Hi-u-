<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác (Interactive Photo Gallery)</title>
    <link rel="stylesheet" href="style.css">
    <script src="gallery.js" defer></script>
</head>
<!-- Yêu cầu 8: Thêm trình nghe cho onload -->
<body onload="initializeGallery()">

    <h1>Thư viện ảnh tương tác</h1>

    <!-- Khung hiển thị hình ảnh lớn -->
    <div id="image">
        Hover over or focus on an image below to display here.
    </div>

    <!-- Yêu cầu 2: Sử dụng 6 hình ảnh có thẻ alt đầy đủ -->
    <!-- Yêu cầu 6: Giữ nguyên onmouseover/onmouseleave và thêm onfocus/onblur -->
    <div class="gallery">
        <img class="preview" 
             alt="Ảnh thiên nhiên núi rừng hùng vĩ" 
             src="https://picsum.photos/id/1018/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" 
             alt="Bờ biển hoàng hôn thơ mộng" 
             src="https://picsum.photos/id/1015/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" 
             alt="Con đường mùa thu lá vàng" 
             src="https://picsum.photos/id/1039/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" 
             alt="Hồ nước trong xanh giữa lòng núi" 
             src="https://picsum.photos/id/1043/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" 
             alt="Thành phố lên đèn về đêm" 
             src="https://picsum.photos/id/1059/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" 
             alt="Rừng thông phủ sương mù" 
             src="https://picsum.photos/id/1069/600/400" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()" 
             onfocus="upDate(this)" 
             onblur="unDo()">
    </div>

</body>
</html>
